  # ===================== World 1: distortion accelerators =====================
  - {from: aqp, to: l-bfgs, dimension: speed, status: qualified, claim: "AQP outperforms L-BFGS on 2D/3D distortion energies.", evidence: "×200 vs MATLAB L-BFGS on isometric example; ×9 on Horse.", source: "10.1145/2897824.2925920", assessed_by: "self; benchmark(E2, NOT reproduced)", notes: "BENCHMARK (results/e2.md): AQP does NOT beat a well-implemented L-BFGS in either a well- or ill-conditioned regime (666 vs 40; 218 vs 55 iters). The ×200 number was vs a MATLAB L-BFGS baseline -- a BASELINE-QUALITY confound. AQP's genuine, separate claim is mesh-independent iteration count + cheap per-iter, not raw iterations vs L-BFGS. Qualified: holds only vs a weak baseline. DESIGN-REGIME TEST, now RIGOROUS (results/mesh_independence.md; multi-seed + independent E* + tau-sweep, closing review-r2 #48/#50/#51/#52): AQP's mesh-independence is TOLERANCE-DEPENDENT. Over a 6.4x DOF increase the growth exponent (iters~DOF^p, 3-seed, 4 sizes, CI-gated) is p=-0.09 (95% CI [-0.41,+0.23], includes 0 -> mesh-INDEPENDENT) at loose tau=1e-3 but p=+0.68 (CI [+0.57,+0.80], clears the flat band -> GROWS) at tight tau=1e-6. So the Laplacian proxy gives mesh-independent INITIAL progress but its first-order asymptotic TAIL is not mesh-independent. NB (review-r3 #R1): whether AQP's tight-tau growth is STEEPER than L-BFGS's (p=+0.45, CI [+0.30,+0.60]) is NOT resolved -- the 95% CIs overlap, so 'AQP scales worse than L-BFGS' is not statistically supported at this sample size; both grow, the ordering is within noise. The round-1 'AQP is mesh-independent' was a LOOSE-TOLERANCE ARTIFACT that the tau-sweep flips. Fair reading of aqp->l-bfgs: AQP loses on raw iteration count at a fixed mesh (baseline-confounded, e2), and its mesh-independence holds only to loose tolerance, not tight."}
  - {from: aqp, to: accelerated-gradient-descent, dimension: scalability, status: qualified, claim: "AQP scales where AGD scales poorly as energies become ill-conditioned.", evidence: "Fig.4 sweep; AGD = AQP with Laplacian proxy disabled (ablation).", source: "10.1145/2897824.2925920", assessed_by: "self; benchmark(results/agd_vs_aqp.md)", notes: "MEASURED (V2.1, results/agd_vs_aqp.md): we ran AGD as the paper's OWN ablation -- solve_aqp(use_proxy=False), the identical accelerated scheme with d=-g instead of d=L^{-1}(-g), nothing else changed. Sweeping an area-preserving anisotropic stretch A=diag(s,1/s) that drives symmetric-Dirichlet from well- to ill-conditioned: a clear CROSSOVER. Well-conditioned (s=1) AGD is FASTER (61 vs AQP 573 -- the Laplacian proxy is the wrong metric and hurts); ill-conditioned (s=2.5) AGD blows up (937 vs 256), and s=3.5 AGD maxiters>3000 vs AQP 991. So 'AQP scales where AGD scales poorly as ill-conditioned' REPRODUCES. theta-ROBUSTNESS (review-V2.1 #4): AGD inherits AQP's Nesterov theta (from eta); to rule out a mistuned-theta artifact we re-ran AGD at s=2.5 across a 1000x sweep of eta (10/100/1000/10000) -> 941/937/949/949 iterations, ALL ~900+ vs AQP 256. Retuning the momentum does NOT rescue AGD; the missing preconditioner does -- so the blow-up is intrinsic, not a theta artifact. QUALIFIED, and it DEFUSES the baseline-confound flag: AGD is a FAIR ablation, not a straw-man -- it beats AQP when well-conditioned; the proxy's value is real but conditional on the ill-conditioned/high-distortion regime. Single mesh/seed per s, iteration-axis."}
  - {from: aqp, to: full-newton, dimension: speed, status: qualified, claim: "AQP faster than Newton in wall-clock despite Newton's lower iteration count.", evidence: "Newton fewest iters but each iter inefficient (full Hessian solve).", source: "10.1145/2897824.2925920", assessed_by: "self; benchmark(results/slim.md, results/scale_cost.md)", notes: "MEASURED (results/slim.md, 8x8 symmetric-Dirichlet): the claim's PREMISE reproduces -- Newton needs the fewest iterations (5 vs AQP 19) but does 5 full global FACTORIZATIONS; AQP prefactors ONCE (1 factorization + 19 cheap back-solves). But the CONCLUSION does not hold at this scale: in our wall-clock AQP is SLOWER than Newton (344ms vs 273ms), because a factorization on a small mesh is cheap and AQP's back-solve tail is long. The wall-clock number is Python/impl-confounded (both are our NumPy), so the HW-independent reading governs: AQP trades 4 fewer factorizations for 14 more iterations, a win only when a factorization is far costlier than a back-solve (large/repeated-solve regime). results/scale_cost.md measures that cost structure and finds AQP's factorize-once advantage does NOT survive at tight tolerance/scale (its iteration count outgrows the few mesh-independent factorizations Newton needs). QUALIFIED: the mechanism (Newton's per-iter is a full solve) is real, but 'AQP faster' is regime-dependent and NOT reproduced on our small-mesh wall-clock."}
  - {from: aqp, to: local-global, dimension: speed, status: self-claimed, claim: "AQP terminates faster than ARAP local/global alternation.", evidence: "0.38s vs 1.55s (2D); ~3× on tet deformation.", source: "10.1145/2897824.2925920", assessed_by: self, notes: "UNTESTABLE here — cross-energy, not fairly constructible (review-P5.2). We ATTEMPTED a back-solve comparison (results/aqp_localglobal.md, 10x10 bend): AQP 11.4 back-solves to its symmetric-Dirichlet minimum vs local-global 5.6 to its ARAP minimum. But this is APPLES-TO-ORANGES: AQP and local-global minimize DIFFERENT energies to DIFFERENT minima, so 'back-solves to each own tol' compares distances to two unrelated basins, not speed — on this bend the ARAP minimum simply sits nearer the start. A fair same-objective race is not constructible without committing both methods to one energy (which the paper does not specify). Also AQP runs an Armijo line search (extra per-iteration energy evals), so 'equal per-iter cost' is not exact. The numbers are descriptive only; they do NOT adjudicate the claim, so the edge stays self-claimed."}
  - {from: slim, to: aqp, dimension: speed, status: validated, claim: "SLIM reaches the same symmetric-Dirichlet energy in fewer iterations and less time than AQP.", evidence: "2–14× faster (Table I); superior descent directions.", source: "10.1145/2983621", assessed_by: "self; benchmark(OFFICIAL libigl SLIM)", notes: "BENCHMARK (results/slim.md): OFFICIAL libigl SLIM (D3). VALIDATED on the HW-INDEPENDENT axis -- to a fair relative-energy tol SLIM needs 5 iters vs AQP 19 (also < L-BFGS 14; = Newton 5). SCOPE (review-r2 #47): single 8x8 scenario/seed/tau -- 'validated' rests on OFFICIAL-CODE regression (libigl, D3) + a large 5-vs-19 margin, not on a seed-averaged profile; a multi-seed/multi-mesh data profile with error bars is the pending step to fully harden it. Soft-vs-hard-constraint confound CHECKED and cleared: SLIM boundary drift ||UV[b]-bc||inf = 4.4e-16 (the soft_p=1e8 penalty enforces the hard BC), so the shared elastic-energy metric + hard E* are fair (review-r1 #35). Two honest caveats: (1) WALL-CLOCK is C++/Python-confounded (libigl SLIM is compiled; our AQP/L-BFGS/Newton are Python) -- SLIM does the same 5 it/5 factorizations as Newton but ~155x less wall, purely implementation; the counts carry the verdict. (2) The real SLIM-vs-AQP tradeoff is FACTORIZATIONS vs ITERATIONS: SLIM 5 factorizations vs AQP 1 (+19 cheap back-solves), so AQP's single-factorization route may close the gap at scale (mesh-independence untested, #29). SLIM is reweighted Gauss-Newton, NOT first-order like AQP -- prose corrected."}
  - {from: slim, to: l-bfgs, dimension: convergence, status: qualified, claim: "SLIM progresses much faster than L-BFGS overall.", evidence: "Fig.12 (386K faces): far faster on time axis.", source: "10.1145/2983621", assessed_by: "self; benchmark(results/slim.md)", notes: "MEASURED (results/slim.md, 8x8 symmetric-Dirichlet, OFFICIAL libigl SLIM): on the HW-independent ITERATION axis SLIM reproduces the edge -- 5 iterations to the energy tol vs L-BFGS 14. SLIM is reweighted Gauss-Newton (refactorizes a global system each iteration: 5 factorizations) whereas L-BFGS uses 0 factorizations, so this is a per-iteration-power-vs-cost tradeoff, not a free lunch. The paper's headline is on the TIME axis at 386K faces; our wall-clock cannot adjudicate that because official SLIM is compiled C++ (1.8ms) and our L-BFGS is Python (135ms) -- a pure implementation confound. QUALIFIED: SLIM's fewer-iterations claim reproduces (official-code-grounded, D3), but the scale/time-axis headline is out of our harness (single 8x8 scenario, needs-scale)."}
  - {from: slim, to: projected-newton, dimension: robustness, status: self-claimed, claim: "SLIM outperforms Newton and regularized Newton on non-uniform triangulations.", evidence: "Fig.11: Newton stalls; 1 SLIM iter ≈ 2000 Newton iters far from min.", source: "10.1145/2983621", assessed_by: self, notes: "NOT ADJUDICABLE here — we could not reach the regime the claim is about (review-P5.2). The claim is specifically about Newton STALLING FAR FROM THE MINIMUM on a bad mesh ('1 SLIM iter ~ 2000 Newton iters far from min', Fig.11). Our harness cannot construct that regime: our Newton is clamp-PROJECTED (SPD-safeguarded) + line-searched, and the deformations we can pose (here a 2x stretch on a 306x-aspect non-uniform mesh, results/slim_nonuniform.md) keep it well-conditioned, so it converges in 5 it while official libigl SLIM crawls a slow linear tail (did not reach the tol in 60; drift 2e-9, not a soft-BC artifact). This does NOT refute the paper -- it means our safeguarded-Newton-on-a-mild-deformation is a STRAWMAN for a claim about raw-Hessian Newton far from the minimum. Left self-claimed / needs-harder-instance; the slim_nonuniform.md numbers are descriptive of our (easier) regime, not a verdict on the paper's."}
