edges:
  # ===================== World 2: eigenvalue-filtering axis =====================
  - {from: absolute-filtering, to: clamp-filtering, dimension: convergence, status: qualified,
     claim: "Absolute eigenvalue filtering needs fewer Newton iterations than clamping for Neo-Hookean / volume-preserving energies.",
     evidence: "~2.5× avg iteration speedup on 593 TetWild/Thingi10k meshes; clamping fails (>200 iters) on 11× stretch at ν=0.4999 while abs stays stable.",
     source: "arXiv:2406.05928", assessed_by: "self; benchmark(P1 locking-confounded; definitive P2+stable-NH: absolute beats clamp near-incompressible)",
     notes: "Author-stated regime limit: for small deformation (esp. compression) abs can slightly damp convergence vs clamping. BENCHMARK (near-incompressible stretch sweep): on displacement-P1 elements absolute UNDER-performs clamp as nu->1/2 and fails (maxiter) at nu=0.4999 (results/e1_nu.md) -- the P1 'refutation' is a volumetric-LOCKING artifact (control C1), confirmed because it persists on the crossed mesh (results/locking.md, though non-monotone) and 3D (results/3d_nu.md). DEFINITIVE COMBINED-CONTROL TEST (review-r3 Fresh #1/#2, results/p2_stable_nu.md): with BOTH confounds removed -- the locking-relieved P2 element AND the correct Stable Neo-Hookean energy (Smith-Kim-de Goes 2018, the energy the paper is built on, not the classical log-barrier NH) -- absolute BEATS clamp near incompressibility, and its advantage GROWS toward the incompressible limit (clamp/absolute iters: 15/13 at nu=0.49 -> 48/38 at 0.4999 -> 113/71 at 0.49999). This growing-advantage trend is strong evidence of a REAL FILTER EFFECT, not residual P2 locking: a residual-locking artifact would show the locking pathology at the extreme limit (as on P1, where absolute FAILS/maxiters), collapsing or reversing the gap -- instead absolute wins harder as nu->1/2, exactly as the paper predicts. So the paper's near-incompressible claim DOES reproduce once locking + energy confounds are both removed. Qualified, not validated, because: 2D, single stretch/seed/tau, and P2 only relieves (a fully locking-free Taylor-Hood P2-P1 element is the pending gold-standard control -- though the growing-advantage trend is what an artifact would NOT produce). FOURTH LOCKING TREATMENT (review-r3 #74, results/sri_nu.md): a Selective-Reduced-Integration P2 element (validated: lower converged energy => locking relieved; no hourglass => clamp and absolute reach the SAME minimum) shows absolute CRUSHING clamp (23 vs 250 it at nu=0.4999) -- SRI's near-singular volumetric mode is exactly where clamp's eps-floor stalls and absolute's |lambda| excels. So FOUR independent locking treatments now concur (P1 crossed-mesh, standard P2, stable-NH P2, SRI-P2): once volumetric locking is relieved, absolute matches or beats clamp near incompressibility -- the P1 'absolute is worse' result is a locking artifact, robustly. SEPARATE REGIME: in the INVERTED-init regime (results/stable_nu.md Part B), absolute vs clamp is a near-null -- a different scenario from the near-incompressible sweep, not a contradiction."}
  - {from: absolute-filtering, to: clamp-filtering, dimension: robustness, status: qualified,
     claim: "Stabilizes optimization at high Poisson ratio (→0.5) and large volume change where clamping gives poor descent.",
     evidence: "Stability at ν∈[0.45,0.5); large negative eigenvalues when λ~100μ coincide with large J−1.", source: "arXiv:2406.05928", assessed_by: "self; benchmark(results/filter_robustness.md)",
     notes: "MEASURED (P5.2, results/filter_robustness.md): on a 100-start inverted-init recovery battery (Stable Neo-Hookean, 5 severities x 20 seeds; success = converged AND inversion-free) absolute and clamp BOTH succeed 100/100 -- the robustness advantage is NOT distinguished (0 starts where one recovers and the other does not). Under a backtracking line search both filters land the same basin, so absolute's claimed edge over clamp does NOT surface as a success-rate difference here. QUALIFIED: the claim's regime is narrower than a general robustness edge -- it is a per-step DESCENT-QUALITY / conditioning claim at ν→0.5 (which the paired convergence edge partially supports on the locking-relieved P2, results/p2_nu.md), not a basin-of-attraction/success-rate difference, which our test finds null."}
  - {from: absolute-filtering, to: numeric-eigendecomposition, dimension: speed, status: self-claimed,
     claim: "Local per-element absolute filtering is dramatically cheaper than global absolute-value projection.",
     evidence: "0.25 s/iter (local) vs >3 hr/iter for global abs on a 38k×38k Hessian.", source: "arXiv:2406.05928", assessed_by: self,
     notes: "Target is 'global abs' full eigendecomposition, not per-element clamping."}
  - {from: trust-region-filtering, to: clamp-filtering, dimension: convergence, status: qualified,
     claim: "Trust-region-adaptive filtering beats stand-alone clamping across quasistatic deformable-solid experiments.",
     evidence: "Iteration/acceleration over a large quasistatic dataset.", source: "arXiv:2410.10102", assessed_by: "self; benchmark(world2_filters, indicative)", notes: "Unifies Newton/clamp/absolute as ONE adaptive operator lambda_eff=(1-w)lambda+w|lambda|, w in {0,0.5,1}. FAITHFUL PER-ELEMENT three-state impl (review-r2 #42/#44 root fix): same per-iteration cost as clamp/absolute (per-element projection + 1 factorization), conformance-gated to EQUAL filters.project_element exactly; P1 and P2 now use the identical implementation (no more assembled-eigh, no P1/P2 split). This filter is a rho-driven SWITCHBOARD over the blend, NOT a trust-region RADIUS method (that is solve_trust_region, results/tr.md) -- named by analogy to Chen et al. The schedule is principled (review-r3): SPD-probe (raw Newton only if the Hessian is actually SPD via Cholesky), escalation tries clamp before absolute, pred<=0 keeps clamp. VERDICT (results/world2_filters.md) is DISCRETIZATION-DEPENDENT: on locking P1 the switchboard clearly WINS -- fewer iterations AND less wall-clock than both filters (120 it/8.0s vs clamp 242 it/11.1s at nu=0.4999; absolute maxiters). On the LOCKING-RELIEVED P2 it is AT BEST A WASH (NB the axis is LOCKING, not conditioning -- measured, P2's Hessian is actually WORSE-conditioned than P1's, kappa~4e6 vs 6e5 at nu=0.4999, mostly because P2 has more DOFs, yet it converges faster; for these direct-solve Newton filters iteration count tracks nonlinearity/locking not kappa(H)): the SPD-probe brings its iteration count to PARITY with clamp (52 vs 53), but it is ~1.8x slower in wall-clock (escalation re-assembly overhead) and absolute is best outright (41 it). So the adaptive switchboard helps only when the problem is HARD; on an easy element it buys nothing over a fixed filter and costs more per step. Round-1 'TR beats both on P2' was an artifact of the costlier global assembled-eigh operator, reversed here. Qualified/indicative: single scenario/seed/tau; the rho->w schedule is one untuned choice."}
  - {from: trust-region-filtering, to: absolute-filtering, dimension: convergence, status: qualified,
     claim: "Adaptive trust-region selection outperforms stand-alone absolute filtering.", evidence: "Beats all stand-alone variants over a large quasistatic dataset.", source: "arXiv:2410.10102", assessed_by: "self; benchmark(world2_filters, indicative)", notes: "BENCHMARK (results/world2_filters.md), faithful PER-ELEMENT three-state blend, same cost as the filters (review-r2 #42/#44). Discretization-dependent: on locking P1 trust-region beats absolute on iterations AND wall-clock (absolute fails/maxiter there); on locking-free P2 it loses to absolute (52 vs 41 it, and slower wall-clock) though it reaches iteration-parity with clamp. See the paired trust-region->clamp edge for the full accounting; the round-1 P2 win was an assembled-eigh artifact, now reversed. Qualified/indicative: single scenario/seed/tau."}
  - {from: trust-region-filtering, to: full-newton, dimension: robustness, status: qualified,
     claim: "Recovers full-Newton convergence when the model fits, without its indefiniteness failures.", evidence: "Unification argument + experiments.", source: "arXiv:2410.10102", assessed_by: "self; benchmark(results/filter_robustness.md)",
     notes: "MEASURED (P5.2, results/filter_robustness.md): on a 100-start inverted-init recovery battery (Stable Neo-Hookean, 5 severities x 20 seeds; success = converged AND inversion-free) the rho-switchboard succeeds 100/100 while our UNFILTERED baseline (filt='none') succeeds only 5/100. HONEST FRAMING (review-P5.2): filt='none' is NOT a well-globalized Newton -- it HARD-TERMINATES on the first non-descent direction (all 95 failures are status='nondescent', measured), with no negative-curvature fallback or trust-region radius. So the +95 margin measures 'presence of ANY indefiniteness handling vs none', not the filter's unique advantage over a competently globalized Newton; a different globalization could also rescue the baseline. The direction is nonetheless real (an unhandled indefinite Hessian does fail, and the SPD-projected switchboard does not). QUALIFIED not validated: baseline is deliberately un-globalized, single energy/mesh/nu, our own TR impl, and the 100 starts are NOT independent (correlated severities on one mesh) so '100/100' is a saturated point estimate, not a powered rate."}
