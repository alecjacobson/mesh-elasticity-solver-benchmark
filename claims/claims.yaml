# Superiority-Claims Graph — machine-readable edges. See schema.md.
# Consolidated from per-paper self-claim extraction (issue #4), 5 agent batches over the corpus.
# Status starts `self-claimed`; `qualified` = the paper itself states a regime limit OR the claim
# rests on a released benchmark pending independent re-run OR it is an independent (not-self) study.
# Hardened to `validated`/`refuted` only with cited evidence (issue #5).
#
# Reconciled node-ids: projected-newton = generic projected/2nd-order Newton baseline (World-1
# distortion); clamp-filtering = the eigenvalue-clamp filter (World-2); full-newton = unfiltered
# Newton. chebyshev-semi-iterative, ipc, advanced-mips, progressive-param are canonical.

