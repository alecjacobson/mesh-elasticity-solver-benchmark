  - {from: bcqn, to: l-bfgs, dimension: convergence, status: qualified, claim: "Blended proxy avoids L-BFGS's slow convergence and swelling artifacts.", evidence: "Fig.4 MIPS 2D shearing: L-BFGS slow + swelling.", source: "arXiv:1705.00039", assessed_by: "self; benchmark(E3 full 2^3, results/e3.md)", notes: "FULL 2^3 FACTORIAL now measured (E3, one unified solver bench/e3_solver.py over line_search x direction x criterion). Attribution (per-cell with seed spread, NOT pooled -- pooling hid an interaction, caught by an adversarial review): the blended-Sobolev DIRECTION is the factor most able to cut iterations vs plain L-BFGS, largest when ill-conditioned (backtracking arm: typical 34->26, ill-conditioned 40->27). BUT the factors ENTANGLE, not add: under the barrier line-search arm the inversion cap binds on Sobolev's large EARLY steps (~12 caps/solve, measured via a cap-bind counter) and REVERSES the typical-stratum advantage (26->37). So the 2^3 does not cleanly separate line-search from direction on this energy. The characteristic criterion only re-times the stop. QUALIFIED: the direction component reproduces (regime-gated), but BCQN's bundle is entangled -- not the sum of independent wins; n=3 seeds, no CI."}
  - {from: sobolev-lbfgs, to: l-bfgs, dimension: convergence, status: qualified, claim: "Sobolev preconditioning (D0=L^-1 proxy) accelerates L-BFGS on ill-conditioned distortion problems.", evidence: "benchmark E2.", source: "arXiv:1705.00039 (component)", assessed_by: "benchmark(E2)", notes: "MEASURED (results/e2.md): the isolated Sobolev-preconditioning component (D0=L^-1) beats plain L-BFGS in the ill-conditioned regime (34 vs 55 iters) but NOT the well-conditioned one (42 vs 40) -- a real, regime-specific win. This is the honest label for what was measured; it is one component of BCQN, not BCQN itself (see bcqn->l-bfgs, self-claimed). beta=0 (pure Sobolev, no blend); the barrier-aware line-search filter is absent. REINFORCED (results/world1_profiles.md, rigorous 10-instance multi-seed + tau-sweep): on well-conditioned perturbation instances Sobolev-L-BFGS is SLOWER than plain L-BFGS at BOTH tau (12 vs 9 at 1e-3; 20 vs 16 at 1e-6) -- so the regime-specificity holds up with spread and a tau-sweep: Sobolev helps only where the problem is ill-conditioned, and hurts otherwise. Stays qualified."}
  - {from: bcqn, to: gradient-descent, dimension: convergence, status: qualified, claim: "Adding BCQN's barrier-aware line-search filter to plain descent improves convergence >1 order.", evidence: "Fig.6: >10× over SGD, ~10× over AQP from the line-search filter ALONE.", source: "arXiv:1705.00039", assessed_by: "self; benchmark(E3, results/e3.md)", notes: "E3 NOW MEASURED the barrier-aware line-search factor in isolation (bench/barrier_ls.py, conformance-gated; L-BFGS direction + |g| criterion held fixed, only the line search swapped). On symmetric Dirichlet the effect is MODEST: median energy-evals 67->56 adversarial / 61->54 typical (single-digit %), success 5/5 in BOTH strata, iterations unchanged -- NOT the >10x of Fig.6. Qualification/mechanism: symmetric Dirichlet is ITSELF a barrier (+inf at J<=0), so plain backtracking already cannot cross an inversion; the barrier-aware LS is partly REDUNDANT with the energy's own barrier (it trims wasted backtracks, doesn't rescue a failing solve). BCQN's >10x line-search win is thus expected to require a NON-barrier energy or un-guarded inits."}
  - {from: anderson-geometry, to: local-global, dimension: convergence, status: validated, claim: "Anderson acceleration of local-global sharply reduces iterations/time.", evidence: "Fig.1 far fewer iters vs plain local-global.", source: "arXiv:1805.05715", assessed_by: "self; benchmark", notes: "BENCHMARK (results/anderson.md, reproducible via `python -m bench.run_anderson`): on a NON-TRIVIAL sheared-target ARAP problem (boundary pinned to an affine shear, interior from rest, minimum E=0.127 -- NOT rest-recovery), Anderson reaches the same minimum in 12 it vs local-global 23 it (~1.9x fewer iterations = back-solves), mesh-independently. VALIDATED with MULTI-SEED spread (review-r2 #47 CLOSED): 3 seeds x 3 meshes (n=6/9/12), the iteration speedup is 1.92x [1.85-2.00] and NEVER collapses to 1x -- robust across seeds and meshes, not a single-seed artifact (results/anderson.md). Wall-clock is also reported and is a SMALLER speedup than the iteration ratio (Anderson's per-iter nfree x m least-squares overhead; at the smallest mesh it is even slightly slower in wall-clock despite fewer iters) -- reported per docs/metrics.md Lever 1. History-buffer zero-column seed bug fixed (review-r1 #36). GENERALITY (#36): the AA core is factored into a map-agnostic anderson_accelerate(G,energy,resid,x0,free,m) and the SAME core also accelerates a Jacobi linear-solve iteration (374 it plain -> 62 at m=5 -> 37 at m=10) -- confirming the acceleration is a property of the generic Anderson core (Peng et al.: m-history, min-norm lstsq, energy safeguard), not of the local-global map."}
  - {from: anderson-geometry, to: l-bfgs, dimension: speed, status: qualified, claim: "Better than L-BFGS in computation time on cloth/elastic sim.", evidence: "Similar energy/iter but cheaper accelerated iterate (m vs 2m+1 inner products).", source: "arXiv:1805.05715", assessed_by: "self; code-inspection", notes: "SPLIT verdict. (1) The per-iterate-COST sub-claim is CONFIRMED by algorithm structure: L-BFGS's two-loop recursion does m inner products in the backward loop + m in the forward loop + ~3 (curvature/gamma) ~= 2m+1 (bench/descent.py:86-91), whereas Anderson's accelerated iterate solves ONE (nfree x k) least-squares (~m inner products for the normal system; bench/world1.py anderson_accelerate) -- so Anderson's step IS cheaper per iteration, exactly the 'm vs 2m+1' the paper states. (2) The end-to-end 'better computation TIME on cloth/elastic sim' is a DYNAMICS claim OUTSIDE our quasi-static 2D harness: it needs time-stepped cloth/elastic simulation (World-1b) with per-step warm-started solves, where iteration counts and wall-clock interact -- we cannot adjudicate that here (needs-dynamics). QUALIFIED: the cost-per-iterate mechanism verifies; the wall-clock-on-cloth headline is out of scope and left explicitly unmeasured with the reason."}
  - {from: anderson-geometry, to: aqp, dimension: convergence, status: self-claimed, claim: "Reaches lower final energy at smaller cost than AQP on 2D ARAP with hard constraints.", evidence: "Fig.5 across resolutions.", source: "arXiv:1805.05715", assessed_by: self, notes: "UNTESTABLE here — same cross-energy confound as aqp->local-global (review-P5.2). We ATTEMPTED it (results/aqp_localglobal.md, shared 10x10 bend): Anderson-accelerated local-global reaches its ARAP minimum in 4.0 back-solves vs AQP's 11.4 to its symmetric-Dirichlet minimum. But Anderson-LG and AQP minimize DIFFERENT energies to DIFFERENT minima, so the lower back-solve count reflects that the ARAP minimum is nearer on this bend, NOT a convergence win; and 'reaches LOWER FINAL ENERGY' is not even comparable across two objectives. A fair test would require an ARAP-AQP (both on ARAP), which the paper does not specify. The numbers are descriptive only and do not adjudicate the claim; edge stays self-claimed."}
  - {from: anderson-geometry, to: chebyshev-semi-iterative, dimension: convergence, status: self-claimed, claim: "Faster energy decrease than Chebyshev semi-iterative in PD.", evidence: "Fig.8.", source: "arXiv:1805.05715", assessed_by: self, notes: ""}
  - {from: anderson-geometry, to: slim, dimension: convergence, status: qualified, claim: "Anderson acceleration speeds up SLIM's optimization.", evidence: "Fig.10: faster than unaccelerated SLIM.", source: "arXiv:1805.05715", assessed_by: "self; benchmark(results/anderson_slim.md, OFFICIAL libigl SLIM, indicative)",
     notes: "MEASURED (P5.2, results/anderson_slim.md). We wrap the OFFICIAL libigl SLIM fixed-point map in the map-agnostic anderson_accelerate core (Peng et al.), making SLIM a PURE map by re-slim_precompute-ing each step -- the runner now VERIFIES this equals continuous SLIM (max coordinate discrepancy over 20 steps = 0.0, so the plain-SLIM baseline is faithful, not an inflated re-precompute artifact). On a deliberately slow-contracting 12x12 non-affine-bend instance, plain SLIM needs 380 iterations to cut the fixed-point residual to 1e-3 of its start; Anderson (m=5) needs 10 -- a 38x reduction, and 325->9 = 36x on the ABSOLUTE gradient-tol criterion (‖g‖<1e-4, the same criterion the validated anderson->local-global edge uses -- so this is NOT metric-shopping, the effect survives an absolute stopping test). Methodological note: SLIM's symmetric-Dirichlet ENERGY saturates in ~1 step, so the acceleration lives in the residual/gradient TAIL; we report both residual- and absolute-tol counts for transparency. QUALIFIED not validated (review-P5.2): the 38x MAGNITUDE is INSTANCE-SELECTED (a bend hand-picked to make SLIM's tail long -- an 'up-to' figure, not typical), and this is a SINGLE instance with m in {0,5} only, versus the multi-seed x multi-mesh evidence the repo reserves for 'validated' (cf. anderson->local-global). The DIRECTION (Anderson wraps and speeds SLIM's fixed point) is solid and official-code-grounded (D3); the magnitude is not a general claim."}
