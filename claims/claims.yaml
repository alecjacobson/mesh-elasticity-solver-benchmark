     source: "arXiv:2311.14526", assessed_by: "corpus; benchmark(1b-dynamic, pitfalls)", notes: "Independent study (not the clamp authors) → qualifies clamp's implicit convergence claim. AFFINE-INVARIANCE sub-claim VALIDATED directly (review-r1 #39, results/pitfalls.md): at an indefinite-Hessian point, under a non-uniform per-DOF coordinate rescaling the unfiltered Newton step is affine-covariant to 3e-13, while clamp/absolute/AND the faithful global-PDN all give O(1) covariance residual (60.8 / 0.21 / 60.8) — projection breaks affine invariance (P(S^T H S) != S^T P(H) S), coordinate-free proof that iteration-count cannot reach. RATE: in a clean SPD-minimum basin clamp is inert in the tail and stays super-linear (honest null on that trajectory; rate degradation needs an active-projection tail). NB the paper's 'PDN recovers affine invariance' is NOT reproduced — our faithful global-PDN also breaks it, since it too projects eigenvalues. 1b-dynamic probe consistent: inertial SPD regularization makes unfiltered Newton converge in FEWER iters than clamp (projecting-when-unneeded hurts)."}
